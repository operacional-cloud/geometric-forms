# Evolution API + Postgres + Redis para o WhatsApp do Geometric Forms.
#
# Como usar:
#   1. Copie .env.example para .env e edite os valores
#   2. docker compose up -d
#   3. Confira logs:  docker compose logs -f evolution
#   4. API estará em http://localhost:8080
#   5. Expõe pra internet com: cloudflared tunnel --url http://localhost:8080

services:
  evolution:
    image: atendai/evolution-api:v2.2.0
    container_name: geometric-evolution
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      - postgres
      - redis
    environment:
      # === Servidor ===
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: ${EVOLUTION_PUBLIC_URL:-http://localhost:8080}

      # === Auth ===
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: 'true'

      # === Banco ===
      DATABASE_ENABLED: 'true'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: geometric_forms
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'true'
      DATABASE_SAVE_MESSAGE_UPDATE: 'true'
      DATABASE_SAVE_DATA_CONTACTS: 'true'
      DATABASE_SAVE_DATA_CHATS: 'true'

      # === Cache (Redis) ===
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://redis:6379/0
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: 'true'

      # === Webhook global (manda eventos pro Next.js no Vercel) ===
      WEBHOOK_GLOBAL_URL: ${WEBHOOK_URL}
      WEBHOOK_GLOBAL_ENABLED: 'true'
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: 'false'
      WEBHOOK_EVENTS_QRCODE_UPDATED: 'true'
      WEBHOOK_EVENTS_MESSAGES_UPSERT: 'true'
      WEBHOOK_EVENTS_MESSAGES_UPDATE: 'true'
      WEBHOOK_EVENTS_CONNECTION_UPDATE: 'true'
      WEBHOOK_EVENTS_SEND_MESSAGE: 'true'

      # === Identificação ===
      CONFIG_SESSION_PHONE_CLIENT: Geometric Forms
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: 30
      QRCODE_COLOR: '#10F2A0'

      # === Logs ===
      LOG_LEVEL: ERROR,WARN,INFO
      LOG_COLOR: 'true'
      DEL_INSTANCE: 'false'
    volumes:
      - evolution_instances:/evolution/instances

  postgres:
    image: postgres:16-alpine
    container_name: geometric-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Sem expor porta na rede pública — só o evolution container acessa.

  redis:
    image: redis:7-alpine
    container_name: geometric-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  evolution_instances:
  postgres_data:
  redis_data:
